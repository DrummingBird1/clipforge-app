name: Release

# 30.10.2026 (הכנה להפצה ציבורית, פריט 4): tag בצורת v* (למשל v1.1.0) בונה את החבילה הניידת ומצרף אותה ל-GitHub Release.
#  - רק על tag - לא על push ולא על PR. ריצה אחת לכל tag, ולא מבטלים ריצה באמצע (cancel-in-progress: false).
#  - ה-tag חייב להתאים ל-APP_VERSION ב-src/utils/shared/version.py, אחרת עוצרים לפני הבנייה.
#  - ffmpeg: ה-build של gyan.dev, ‏GPLv3 essentials (libx264 ו-vidstab - הקוד צריך את שניהם), נעול ל-SHA-256 שמ-GitHub.
#  - Python מ-actions/setup-python (הגרסה מ-.python-version); dev/build_portable.py מעתיק אותו לחבילה, והספריות מ-uv.lock
#    בלי קבוצת dev. הסקריפט רץ ישירות עם python (בלי uv run) - אין צורך ב-.venv עם כל קבוצת dev.
#  - הערות ה-Release: הפסקה של הגרסה מ-CHANGELOG.md.
#  - 30.10.2026: attestation של מקור הבנייה (actions/attest-build-provenance) על ה-zip ועל SHA256SUMS.txt - מי שהוריד
#    בודק עם `gh attestation verify <zip> --repo <הריפו>` שהקובץ נבנה כאן, מה-tag הזה. כל action מוצמד ל-SHA מלא.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write       # יצירת ה-Release והעלאת ה-zip
  id-token: write       # attestation: חתימה דרך ה-OIDC של GitHub
  attestations: write   # attestation: שמירה בריפו

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FFMPEG_URL: https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip
  FFMPEG_SHA256: 60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: The tag matches the app version
        shell: bash
        run: |
          version=$(python -c "import re; print(re.search(r'^APP_VERSION = \"([^\"]+)\"', open('src/utils/shared/version.py', encoding='utf-8').read(), re.M).group(1))")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != APP_VERSION v$version"; exit 1; }

      - name: Download FFmpeg (pinned)
        shell: bash
        run: |
          curl -fsSL -o ffmpeg.zip "$FFMPEG_URL"
          echo "$FFMPEG_SHA256  ffmpeg.zip" | sha256sum -c -

      - name: Build the portable package
        run: python dev/build_portable.py --ffmpeg ffmpeg.zip

      - name: Check the zip against SHA256SUMS.txt
        shell: bash
        run: cd dist && sha256sum -c SHA256SUMS.txt

      - name: Attest the build provenance of the zip and SHA256SUMS.txt
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/ClipForge-*-win64.zip
            dist/SHA256SUMS.txt

      - name: Create the Release with the zip and its SHA-256
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'EOF' > release_notes.md
          import os, re
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(rf"^## {re.escape(version)}\b.*?$(.*?)(?=^## |\Z)", text, re.M | re.S)
          print(match.group(1).strip() if match else f"ClipForge {version}")
          digest, name = open("dist/SHA256SUMS.txt", encoding="utf-8").read().split()
          print(f"\n### Download check\nSHA-256 of `{name}`:\n\n```\n{digest}\n```\n")
          print("PowerShell: `Get-FileHash .\\" + name + "` - the hash must match.")
          print(f"\nBuilt by GitHub Actions from this tag: `gh attestation verify {name} --repo {os.environ['GITHUB_REPOSITORY']}`")
          EOF
          gh release create "$GITHUB_REF_NAME" dist/ClipForge-*-win64.zip dist/SHA256SUMS.txt --title "ClipForge $GITHUB_REF_NAME" --notes-file release_notes.md
