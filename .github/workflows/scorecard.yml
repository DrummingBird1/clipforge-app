name: Scorecard

# 30.10.2026 (הריפו הציבורי): OpenSSF Scorecard - בדיקת שיטות האבטחה של הריפו (actions מוצמדים, הרשאות מינימליות, הגנת ענפים
# וכו'). התוצאות מתפרסמות ב-scorecard.dev (publish_results, דרך ה-OIDC של GitHub) ונכנסות ל-code scanning כ-SARIF. רץ רק בריפו
# ציבורי - Scorecard מיועד לריפו ציבורי, וה-upload ל-code scanning בריפו פרטי הוא חלק מ-GHAS בתשלום.
# לפי התיעוד של ossf/scorecard-action: בלי env או defaults ברמת ה-workflow, והרשאות כתיבה רק ב-job.
on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: "41 4 * * 2"   # פעם בשבוע, שלישי 04:41 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write   # העלאת ה-SARIF ל-code scanning
      id-token: write          # publish_results - חתימה דרך ה-OIDC של GitHub
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Keep the SARIF as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
