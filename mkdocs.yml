# The ClipForge documentation site (GitHub Pages, .github/workflows/pages.yml). Local preview: uv run mkdocs serve
# README.md, CHANGELOG.md and ROADMAP.md come from the repository root through dev/mkdocs_hooks.py.
site_name: ClipForge
site_description: A local video studio for Windows - edit, brand and export gameplay clips and data videos from your browser.
site_url: https://drummingbird1.github.io/clipforge-app/
repo_url: https://github.com/DrummingBird1/clipforge-app
repo_name: DrummingBird1/clipforge-app
edit_uri: edit/main/docs/

docs_dir: docs
exclude_docs: |
  handoff/
  history/
  github-about.md

hooks:
  - dev/mkdocs_hooks.py

# A link to a missing heading is a warning too, so `mkdocs build --strict` fails on it
validation:
  anchors: warn

theme:
  name: material
  icon:
    logo: material/movie-open-outline
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
      # GitHub-style heading ids, so the docs' tables of contents work both on GitHub and on the site
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Home: index.md
  - Your first video: getting_started.md
  - Studio: video_editor.md
  - Data videos: dataviz.md
  - Web UI: web_ui.md
  - Scripts: scripts.md
  - Scheduling: scheduling_and_conventions.md
  - Development: development.md
  - Changelog: changelog.md
  - Roadmap: roadmap.md
